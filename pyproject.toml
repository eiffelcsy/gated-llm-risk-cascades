[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskcascade"
version = "0.1.0"
description = "Two-tier risk defence: when should an expensive model overrule a cheap one?"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "pyyaml>=6"]

[project.optional-dependencies]
content = ["torch>=2.3", "transformers>=4.45", "pillow>=10", "easyocr>=1.7"]
tx = ["pandas>=2.2", "lightgbm>=4.3", "shap>=0.45"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
